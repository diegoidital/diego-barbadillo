# Endurecimiento de Apache para WordPress (se monta en conf-enabled del contenedor).

ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None

<Directory /var/www/html>
    Options -Indexes -Includes +FollowSymLinks
</Directory>

# Ficheros que nunca deben servirse.
<FilesMatch "^(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt|licencia\.txt|xmlrpc\.php|install\.php|\.ht.*|\.env.*|composer\.(json|lock)|package(-lock)?\.json)$">
    Require all denied
</FilesMatch>
<FilesMatch "\.(log|sql|sqlite|bak|old|orig|swp|ini|sh|dist|yml|yaml|md|git.*)$">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(git|svn|hg)">
    Require all denied
</DirectoryMatch>

# Nunca ejecutar PHP subido por usuarios.
<Directory /var/www/html/wp-content/uploads>
    <FilesMatch "\.(php|php\d|phtml|phar|pht|phps)$">
        Require all denied
    </FilesMatch>
</Directory>

# El código del plugin de pagos no se ejecuta directamente desde fuera (solo a través de WordPress).
<Directory /var/www/html/wp-content/plugins/idital-pagos/includes>
    Require all denied
</Directory>

# wp-includes: solo recursos estáticos.
<Directory /var/www/html/wp-includes>
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^(ms-files\.php|wp-tinymce\.php)$">
        Require all granted
    </FilesMatch>
</Directory>
<Directory /var/www/html/wp-includes/js/tinymce/langs>
    <FilesMatch "\.php$">
        Require all granted
    </FilesMatch>
</Directory>

<IfModule mod_headers.c>
    Header always unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# Límite de tamaño de las peticiones (16 MB).
LimitRequestBody 16777216
