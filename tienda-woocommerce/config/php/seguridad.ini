; Endurecimiento de PHP para WordPress.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
allow_url_include = Off
allow_url_fopen = On
; Funciones que WordPress/WooCommerce no necesitan y que un atacante usaría para ejecutar comandos.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,dl,show_source
file_uploads = On
upload_max_filesize = 16M
post_max_size = 16M
max_execution_time = 60
memory_limit = 256M
max_input_vars = 3000
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_only_cookies = 1
