name: Vigilancia web

on:
  schedule:
    - cron: "4,24,44 * * * *" # cada 20 min (minutos 4, 24 y 44, UTC); GitHub retrasa o salta a veces las programadas
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions
    inputs:
      email_prueba:
        description: "Enviar email de prueba (aunque no haya cambios)"
        type: boolean
        default: false

permissions:
  contents: write # para guardar las instantáneas en el repositorio

concurrency:
  group: vigilancia-web
  cancel-in-progress: true # una ejecución nueva sustituye a la anterior si sigue en marcha o esperando

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # normalmente tarda ~15 s; si se atasca, se corta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 pyyaml

      - name: Comprobar páginas
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          EMAIL_PRUEBA: ${{ inputs.email_prueba }}
        run: python vigilancia-web/vigilar.py

      - name: Guardar instantáneas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vigilancia-web/snapshots
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Vigilancia web: actualizar instantáneas"
            git push
          fi
