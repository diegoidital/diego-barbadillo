# Páginas a vigilar.
# - nombre:   identificador corto (sin espacios); se usa para el fichero de la instantánea.
# - url:      dirección pública de la página.
# - selector: (opcional) selector CSS de la zona a vigilar. Si se omite, se vigila todo el <body>.
#             Recomendado: así se evitan avisos falsos por banners, fechas, contadores, etc.
# - enlaces:  (opcional, true/false) vigilar también la dirección de los enlaces, no solo su texto.
# - pdfs:     (opcional, true/false) descargar los PDF enlazados en la zona vigilada: avisa si
#             cambian (aunque el enlace siga igual) y los adjunta al email.
# - ignorar:  (opcional) lista de expresiones regulares; las líneas que coincidan se descartan.

paginas:
  # Sede Ayuntamiento de Valencia - Matrimonios civiles (PA.BO.10), versión en castellano.
  # Vigila el nombre y el enlace de los documentos adjuntos de la descripción
  # (actualmente "Calendario de celebración de matrimonios civiles año 2026").
  - nombre: valencia-matrimonios-civiles
    url: https://sede.valencia.es/sede/registro/procedimiento/PA.BO.10?lang=1
    selector: "#descProc a"
    enlaces: true
    pdfs: true
